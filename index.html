<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero at all. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Must match the manifest's theme_color exactly, or iOS picks one and Chrome the other. -->
    <meta name="theme-color" content="#12141a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="A Vue 3 offline-first PWA that keeps rendering with the network off and is honest about how old its data is."
    />
    <title>Offline-First Résumé — a Vue 3 build log</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
